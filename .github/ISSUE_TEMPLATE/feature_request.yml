name: Feature request
description: Suggest a rule, flag, output format, or integration
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Feature ideas are welcome. Before filing, please check the [Roadmap](../blob/main/README.md#roadmap) — an item may already be planned — and search existing issues so this does not become a duplicate.

        portafs deliberately stays small and zero-dependency; proposals are weighed against that constraint.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of feature?
      options:
        - New rule (a class of portability problem portafs should flag)
        - New flag / CLI behavior
        - Output format (JSON shape, report, CI integration)
        - Baseline / workflow improvement
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can go wrong today, with a concrete example (repository layout, file name, command)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like portafs to do. For rule ideas — which platforms break, and how would you expect the violation to be reported?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or configurations you tried or considered. Not required.
  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to contribute
      options:
        - label: I am willing to help implement this (see [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md))
